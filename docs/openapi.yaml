openapi: 3.1.0
info:
  title: Transaction Processing API
  version: 1.0.0
  description: Atomic, authenticated, and idempotent balance transfer service.
servers:
  - url: http://localhost:3000
tags:
  - name: System
  - name: Authentication
  - name: Users
  - name: Transfers
  - name: Transactions
paths:
  /health:
    get:
      tags: [System]
      summary: Check API and database health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: Database is unavailable
  /users:
    post:
      tags: [Users]
      summary: Create a zero-balance user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Issue a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [accessToken, tokenType]
                    properties:
                      accessToken: { type: string }
                      tokenType: { type: string, const: Bearer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get authorized user details
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/balance:
    get:
      tags: [Users]
      summary: Get authorized current balance
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [userId, balance, updatedAt]
                    properties:
                      userId: { type: string, format: uuid }
                      balance: { type: string, pattern: "^[0-9]+$" }
                      updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /transfers:
    post:
      tags: [Transfers]
      summary: Transfer balance atomically
      description: The idempotency key is scoped to the authenticated sender.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: New transfer completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "200":
          description: Existing completed transfer replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Idempotency key conflict or concurrent balance change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Transfer failed, for example because of insufficient balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /transactions:
    get:
      tags: [Transactions]
      summary: List authorized transaction history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: userId
          in: query
          description: Admins may filter any user. Normal users may only use their own ID.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed]
      responses:
        "200":
          description: Paginated transaction history
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated user cannot access this resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: User or route not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must include upper-case, lower-case, and numeric characters.
    User:
      type: object
      required: [id, name, email, balance, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        balance: { type: string, pattern: "^[0-9]+$" }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/User" }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [fromUserId, toUserId, amount]
      properties:
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    Transaction:
      type: object
      required:
        [id, fromUserId, toUserId, amount, status, failureCode, createdAt,
         updatedAt, completedAt, failedAt]
      properties:
        id: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        toUserId: { type: string, format: uuid }
        amount: { type: string, pattern: "^[0-9]+$" }
        status: { type: string, enum: [pending, completed, failed] }
        failureCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        failedAt: { type: [string, "null"], format: date-time }
    TransferResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/Transaction" }
        meta:
          type: object
          required: [idempotentReplayed]
          properties:
            idempotentReplayed: { type: boolean }
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
